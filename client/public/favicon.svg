<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1a1a2e"/>
  <!-- Print bed -->
  <rect x="5" y="22" width="22" height="3" rx="1" fill="#4a9eff"/>
  <!-- Printed object (simple cube layers) -->
  <rect x="10" y="16" width="12" height="2" rx="0.5" fill="#4a9eff" opacity="0.7"/>
  <rect x="10" y="13" width="12" height="2" rx="0.5" fill="#4a9eff" opacity="0.85"/>
  <rect x="10" y="10" width="12" height="2" rx="0.5" fill="#4a9eff"/>
  <!-- Gantry bar -->
  <rect x="3" y="7" width="26" height="2" rx="1" fill="#888"/>
  <!-- Print head -->
  <rect x="13" y="6" width="6" height="5" rx="1" fill="#ccc"/>
  <!-- Nozzle tip -->
  <polygon points="15,11 17,11 16,13" fill="#ff6b35"/>
</svg>
